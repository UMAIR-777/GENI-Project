version: '3.8'

services:
  pgvector_db:
    image: pgvector/pgvector:pg17
    container_name: pgvector_db
    ports:
      - "5433:5432" # Expose PostgreSQL on port 5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unicorn
      POSTGRES_DB: postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: kaleem@sleepwellsystem.com # change to your email
      PGADMIN_DEFAULT_PASSWORD: unicorn # change to your password
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgvector_data:
  pgadmin_data:
